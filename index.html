<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0C2A3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HydriaDeza">
<title>HydriaDeza · Red de agua</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --deep:   #0C2A3A;
    --deep-2: #123A4E;
    --brand:  #0E7490;
    --brand-d:#0B6079;
    --accent: #06B6D4;
    --danger: #DC2626;
    --ok:     #059669;
    --amber:  #F59E0B;
    --bg:     #F1F5F9;
    --surface:#FFFFFF;
    --text:   #0F172A;
    --muted:  #64748B;
    --border: #E2E8F0;
    --shadow: 0 8px 24px rgba(12,42,58,.16);
    --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: var(--sans); color: var(--text); background: var(--bg); }
  body { display: flex; flex-direction: column; overflow: hidden; }

  /* ---------- Barra superior ---------- */
  .appbar {
    background: var(--deep); color: #fff;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display: flex; align-items: center; gap: 11px; z-index: 1200;
    box-shadow: 0 1px 0 rgba(255,255,255,.06), 0 4px 16px rgba(0,0,0,.25);
  }
  .brandmark { flex: none; width: 34px; height: 34px; }
  .brandtext { line-height: 1.1; margin-right: auto; }
  .brandtext .name { font-weight: 700; font-size: 17px; letter-spacing: -.2px; }
  .brandtext .sub { font-size: 11px; color: #7FB8CC; font-weight: 500; letter-spacing: .3px; }
  .gps {
    display: flex; align-items: center; gap: 6px;
    background: var(--deep-2); border: 1px solid rgba(255,255,255,.08);
    padding: 6px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; color: #CBD5E1;
  }
  .gps .led { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .gps.on  .led { background: var(--ok); box-shadow: 0 0 0 3px rgba(5,150,105,.25); }
  .gps.on  { color: #A7F3D0; }

  /* ---------- Buscador ---------- */
  .searchwrap { background: var(--deep); padding: 0 12px 12px; z-index: 1200; }
  .search {
    display: flex; align-items: center; gap: 9px;
    background: var(--surface); border-radius: 12px; padding: 0 12px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.04);
  }
  .search svg { flex: none; color: var(--muted); }
  .search input {
    flex: 1; border: none; outline: none; padding: 13px 0; font-size: 15px;
    font-family: var(--sans); background: transparent; color: var(--text);
  }
  .search input::placeholder { color: #94A3B8; }

  /* ---------- Mapa ---------- */
  #map { flex: 1; z-index: 1; }
  .leaflet-container { background: #e8eef2; font-family: var(--sans); }

  /* Marcador de válvula */
  .pin { position: relative; }
  .pin svg { display: block; filter: drop-shadow(0 3px 4px rgba(12,42,58,.35)); }
  .pin.hl svg { filter: drop-shadow(0 0 0 3px var(--amber)) drop-shadow(0 3px 5px rgba(12,42,58,.4)); }
  .pin.hl { animation: bob 1.1s ease-in-out infinite; }
  @keyframes bob { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-4px) } }

  /* Leyenda */
  .legend {
    position: absolute; top: 12px; left: 12px; z-index: 900;
    background: rgba(255,255,255,.94); backdrop-filter: blur(6px);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 11px; font-size: 11.5px; color: var(--text);
    box-shadow: var(--shadow); display: grid; gap: 5px;
  }
  .legend .row { display: flex; align-items: center; gap: 7px; font-weight: 500; }
  .legend .sw { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #fff; box-shadow: 0 0 0 1px var(--border); }

  /* ---------- Barra de acciones ---------- */
  .actionbar {
    position: relative; z-index: 1100; display: flex; gap: 10px;
    padding: 12px 12px calc(env(safe-area-inset-bottom) + 12px);
    background: linear-gradient(to top, var(--surface) 78%, rgba(255,255,255,0));
  }
  .btn {
    border: none; border-radius: 13px; font-family: var(--sans); font-weight: 600;
    font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary { flex: 1; background: var(--brand); color: #fff; padding: 15px; box-shadow: 0 6px 16px rgba(14,116,144,.35); }
  .btn-primary:active { background: var(--brand-d); }
  .btn-ghost {
    flex: none; width: 52px; background: var(--surface); color: var(--brand);
    border: 1.5px solid var(--border);
  }
  .btn-ghost:active { background: var(--bg); }

  /* ---------- Panel deslizante (sheet) ---------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(12,42,58,.45); z-index: 1500;
    opacity: 0; pointer-events: none; transition: opacity .22s ease;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1600;
    background: var(--surface); border-radius: 20px 20px 0 0;
    padding: 8px 20px calc(env(safe-area-inset-bottom) + 22px);
    box-shadow: 0 -10px 40px rgba(12,42,58,.28);
    transform: translateY(101%); transition: transform .28s cubic-bezier(.32,.72,0,1);
    max-height: 82vh; overflow-y: auto;
  }
  .sheet.open { transform: translateY(0); }
  .grip { width: 40px; height: 4px; border-radius: 999px; background: var(--border); margin: 0 auto 16px; }

  .sheet h2 { font-size: 20px; letter-spacing: -.3px; margin-bottom: 3px; }
  .sheet .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 14px; }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.abierta { background: #CFFAFE; color: var(--brand-d); }
  .badge.cerrada { background: #FEE2E2; color: var(--danger); }
  .badge .dotb { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .datagrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 18px; }
  .cell { background: var(--bg); border-radius: 12px; padding: 11px 13px; }
  .cell .k { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .cell .v { font-family: var(--mono); font-size: 15px; font-weight: 600; margin-top: 3px; }

  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; padding: 13px 12px; border: 1.5px solid var(--border); border-radius: 11px;
    font-size: 16px; font-family: var(--sans); color: var(--text); background: var(--surface);
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--brand); }

  .sheet-actions { display: flex; gap: 10px; margin-top: 4px; }
  .sheet-actions .btn { flex: 1; padding: 14px; }
  .btn-line { background: var(--surface); border: 1.5px solid var(--border); color: var(--text); }
  .btn-danger { background: var(--surface); border: 1.5px solid #FCA5A5; color: var(--danger); }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 92px);
    transform: translate(-50%, 20px); z-index: 2000;
    background: var(--deep); color: #fff; padding: 12px 18px; border-radius: 12px;
    font-size: 13.5px; font-weight: 500; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: all .28s ease; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  input[type=file] { display: none; }
</style>
</head>
<body>

<header class="appbar">
  <svg class="brandmark" viewBox="0 0 40 40" fill="none">
    <path d="M20 4C20 4 8 17 8 26a12 12 0 0 0 24 0C32 17 20 4 20 4Z" fill="#06B6D4"/>
    <path d="M20 4C20 4 8 17 8 26a12 12 0 0 0 24 0C32 17 20 4 20 4Z" fill="url(#g)" fill-opacity="0.35"/>
    <path d="M15 25a5 5 0 0 0 5 5" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
    <defs><linearGradient id="g" x1="8" y1="4" x2="32" y2="38"><stop stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  </svg>
  <div class="brandtext">
    <div class="name">HydriaDeza</div>
    <div class="sub">RED DE AGUA · DEZA</div>
  </div>
  <div class="gps" id="gps"><span class="led"></span><span id="gpsTxt">Buscando GPS</span></div>
</header>

<div class="searchwrap">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search" placeholder="Buscar avería o aldea…">
  </div>
</div>

<div id="map">
  <div class="legend">
    <div class="row"><span class="sw" style="background:var(--brand)"></span>Abierta</div>
    <div class="row"><span class="sw" style="background:var(--danger)"></span>Cerrada</div>
    <div class="row"><span class="sw" style="background:var(--ok)"></span>Tu posición</div>
  </div>
</div>

<div class="actionbar">
  <button class="btn btn-primary" onclick="registrarAqui()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.3-7-11a7 7 0 0 1 14 0c0 4.7-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
    Registrar válvula
  </button>
  <button class="btn btn-ghost" onclick="exportar()" aria-label="Exportar">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 12 5 5 5-5"/><path d="M5 21h14"/></svg>
  </button>
  <button class="btn btn-ghost" onclick="document.getElementById('file').click()" aria-label="Importar">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="m7 12 5-5 5 5"/><path d="M5 3h14"/></svg>
  </button>
  <input type="file" id="file" accept="application/json" onchange="importar(event)">
</div>

<div class="scrim" id="scrim" onclick="cerrarSheet()"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.min.js"></script>
<script>
const CENTRO = [42.6614, -8.1132];
const KEY = 'hydriadeza_valvulas';
const SEED = [
  { id: 1, nombre: 'Vilanova', lat: 42.615239, lng: -8.135261, diametro: 100, estado: 'cerrada', aisla: 'Vilanova' },
];

let valvulas = cargar();
let map, posOperario = null, userMarker = null, routingControl = null, capturada = null;
const markers = {};

function cargar() { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : SEED.slice(); } catch { return SEED.slice(); } }
function persistir() {
  try {
    localStorage.setItem(KEY, JSON.stringify(valvulas));
    localStorage.setItem(KEY + '_backup', JSON.stringify({ fecha: new Date().toISOString(), valvulas }));
  } catch {}
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

function initMap() {
  map = L.map('map', { zoomControl: false }).setView(CENTRO, 14);
  L.control.zoom({ position: 'bottomleft' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO', maxZoom: 20, subdomains: 'abcd',
  }).addTo(map);

  valvulas.forEach(v => pintar(v));
  ajustarVista();

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(onPos, () => setGps(false), { enableHighAccuracy: true });
    navigator.geolocation.watchPosition(onPos, null, { enableHighAccuracy: true });
  }
}

function onPos(p) {
  posOperario = L.latLng(p.coords.latitude, p.coords.longitude);
  setGps(true);
  if (userMarker) userMarker.setLatLng(posOperario);
  else {
    userMarker = L.circleMarker(posOperario, {
      radius: 9, color: '#fff', weight: 3, fillColor: '#059669', fillOpacity: 1,
    }).addTo(map);
    map.setView(posOperario, 16);
  }
}
function setGps(on) {
  const g = document.getElementById('gps');
  g.classList.toggle('on', on);
  document.getElementById('gpsTxt').textContent = on ? 'GPS activo' : 'Sin GPS';
}

function pinIcon(estado, hl) {
  const color = estado === 'cerrada' ? '#DC2626' : '#0E7490';
  return L.divIcon({
    className: '',
    html: `<div class="pin ${hl ? 'hl' : ''}"><svg width="30" height="40" viewBox="0 0 30 40">
      <path d="M15 39c0-1 12-14 12-24A12 12 0 1 0 3 15c0 10 12 23 12 24Z" fill="${color}"/>
      <circle cx="15" cy="15" r="6.5" fill="#fff"/>
      <circle cx="15" cy="15" r="3" fill="${color}"/></svg></div>`,
    iconSize: [30, 40], iconAnchor: [15, 39],
  });
}

function pintar(v, hl = false) {
  if (markers[v.id]) markers[v.id].remove();
  const m = L.marker([v.lat, v.lng], { icon: pinIcon(v.estado, hl) }).addTo(map);
  m.on('click', () => abrirDetalle(v));
  markers[v.id] = m;
}

function ajustarVista() {
  const ms = Object.values(markers);
  if (ms.length) map.fitBounds(L.featureGroup(ms).getBounds().pad(0.35));
}

/* ---------- Sheet ---------- */
function abrirSheet() { document.getElementById('scrim').classList.add('open'); document.getElementById('sheet').classList.add('open'); }
function cerrarSheet() { document.getElementById('scrim').classList.remove('open'); document.getElementById('sheet').classList.remove('open'); }

function abrirDetalle(v) {
  document.getElementById('sheetBody').innerHTML = `
    <h2>${v.nombre}</h2>
    <div class="meta">${v.lat.toFixed(6)}, ${v.lng.toFixed(6)}</div>
    <span class="badge ${v.estado}"><span class="dotb"></span>${v.estado === 'cerrada' ? 'Cerrada' : 'Abierta'}</span>
    <div class="datagrid">
      <div class="cell"><div class="k">Diámetro</div><div class="v">${v.diametro ? 'DN ' + v.diametro : '—'}</div></div>
      <div class="cell"><div class="k">Aísla</div><div class="v" style="font-family:var(--sans)">${v.aisla || '—'}</div></div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-danger" onclick="borrar(${v.id})">Borrar</button>
      <button class="btn btn-primary" onclick="trazarRuta(${v.lat}, ${v.lng})">Trazar ruta</button>
    </div>`;
  abrirSheet();
}

function registrarAqui() {
  if (!navigator.geolocation) { toast('Este dispositivo no tiene GPS'); return; }
  toast('Leyendo tu ubicación…');
  navigator.geolocation.getCurrentPosition((p) => {
    capturada = { lat: p.coords.latitude, lng: p.coords.longitude, prec: p.coords.accuracy };
    document.getElementById('sheetBody').innerHTML = `
      <h2>Nueva válvula</h2>
      <div class="meta">${capturada.lat.toFixed(6)}, ${capturada.lng.toFixed(6)} · ±${Math.round(capturada.prec)} m</div>
      <div style="height:14px"></div>
      <div class="field"><label>Aldea o calle</label><input id="f_nombre" placeholder="Ej: Vilanova" autocomplete="off"></div>
      <div class="field"><label>Estado</label><select id="f_estado"><option value="abierta">Abierta</option><option value="cerrada">Cerrada</option></select></div>
      <div class="field"><label>¿Qué aísla?</label><input id="f_aisla" placeholder="Zona que se queda sin agua" autocomplete="off"></div>
      <div class="field"><label>Diámetro DN (opcional)</label><input id="f_dn" type="number" inputmode="numeric" placeholder="Ej: 100"></div>
      <div class="sheet-actions">
        <button class="btn btn-line" onclick="cerrarSheet()">Cancelar</button>
        <button class="btn btn-primary" onclick="guardar()">Guardar válvula</button>
      </div>`;
    abrirSheet();
  }, () => toast('No pude leer el GPS. Activa la ubicación.'), { enableHighAccuracy: true });
}

function guardar() {
  const nombre = (document.getElementById('f_nombre').value || '').trim() || 'Sin nombre';
  const nueva = {
    id: Date.now(), nombre, lat: capturada.lat, lng: capturada.lng,
    estado: document.getElementById('f_estado').value,
    aisla: (document.getElementById('f_aisla').value || '').trim(),
    diametro: document.getElementById('f_dn').value ? Number(document.getElementById('f_dn').value) : null,
  };
  valvulas.push(nueva); persistir(); pintar(nueva);
  map.setView([nueva.lat, nueva.lng], 17);
  cerrarSheet(); toast(`Válvula "${nombre}" registrada`);
}

function borrar(id) {
  const v = valvulas.find(x => x.id === id);
  if (!confirm(`¿Borrar la válvula "${v ? v.nombre : ''}"?`)) return;
  valvulas = valvulas.filter(x => x.id !== id); persistir();
  if (markers[id]) { markers[id].remove(); delete markers[id]; }
  cerrarSheet(); toast('Válvula borrada');
}

function trazarRuta(lat, lng) {
  cerrarSheet();
  if (!posOperario) { toast('Aún no tengo tu ubicación GPS'); return; }
  if (routingControl) map.removeControl(routingControl);
  routingControl = L.Routing.control({
    waypoints: [posOperario, L.latLng(lat, lng)],
    router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1' }),
    lineOptions: { styles: [{ color: '#0E7490', weight: 5, opacity: .9 }] },
    createMarker: () => null, addWaypoints: false, fitSelectedRoutes: true, show: false,
  }).addTo(map);
  toast('Ruta trazada');
}

document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  let primera = null;
  valvulas.forEach(v => {
    const match = !!q && ((v.aisla || '').toLowerCase().includes(q) || (v.nombre || '').toLowerCase().includes(q));
    pintar(v, match);
    if (match && !primera) primera = v;
  });
  if (primera) map.setView([primera.lat, primera.lng], 16);
});

function exportar() {
  const blob = new Blob([JSON.stringify(valvulas, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'valvulas_hydriadeza.json'; a.click();
  toast(`${valvulas.length} válvulas exportadas`);
}

function importar(ev) {
  const file = ev.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data)) throw 0;
      valvulas = data; persistir();
      Object.values(markers).forEach(m => m.remove());
      for (const k in markers) delete markers[k];
      valvulas.forEach(v => pintar(v)); ajustarVista();
      toast(`${valvulas.length} válvulas importadas`);
    } catch { toast('Archivo JSON no válido'); }
  };
  r.readAsText(file);
}

initMap();
</script>
</body>
</html>
