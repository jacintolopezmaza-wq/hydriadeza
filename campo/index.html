<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0C2A3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HydriaDeza">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; connect-src 'self' https: http://localhost:* http://127.0.0.1:*;">
<title>HydriaDeza · Red de agua</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --deep:#0C2A3A; --deep-2:#123A4E; --brand:#0E7490; --brand-d:#0B6079; --accent:#06B6D4;
    --danger:#DC2626; --ok:#059669; --amber:#F59E0B; --bg:#F1F5F9; --surface:#FFFFFF;
    --text:#0F172A; --muted:#64748B; --border:#E2E8F0; --shadow:0 8px 24px rgba(12,42,58,.16);
    --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; font-family:var(--sans); color:var(--text); background:var(--bg); }
  body { display:flex; flex-direction:column; overflow:hidden; }

  .appbar { background:var(--deep); color:#fff; padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;
    display:flex; align-items:center; gap:10px; z-index:1200; box-shadow:0 4px 16px rgba(0,0,0,.25); }
  .brandmark { flex:none; width:32px; height:32px; }
  .brandtext { line-height:1.1; margin-right:auto; }
  .brandtext .name { font-weight:700; font-size:16px; letter-spacing:-.2px; }
  .brandtext .sub { font-size:10.5px; color:#7FB8CC; font-weight:500; letter-spacing:.3px; }
  .gps { display:flex; align-items:center; gap:6px; background:var(--deep-2); border:1px solid rgba(255,255,255,.08);
    padding:6px 9px; border-radius:999px; font-size:10.5px; font-weight:600; color:#CBD5E1; }
  .gps .led { width:7px; height:7px; border-radius:50%; background:var(--muted); }
  .gps.on .led { background:var(--ok); box-shadow:0 0 0 3px rgba(5,150,105,.25); }
  .gps.on { color:#A7F3D0; }
  .iconbtn { flex:none; width:36px; height:36px; border-radius:10px; border:1px solid rgba(255,255,255,.12);
    background:var(--deep-2); color:#CBD5E1; display:flex; align-items:center; justify-content:center; cursor:pointer; }

  .searchwrap { background:var(--deep); padding:0 12px 12px; z-index:1200; }
  .search { display:flex; align-items:center; gap:9px; background:var(--surface); border-radius:12px; padding:0 12px; }
  .search svg { flex:none; color:var(--muted); }
  .search input { flex:1; border:none; outline:none; padding:13px 0; font-size:15px; font-family:var(--sans); background:transparent; color:var(--text); }
  .search input::placeholder { color:#94A3B8; }

  #map { flex:1; z-index:1; }
  .leaflet-container { background:#e8eef2; font-family:var(--sans); }

  .pin svg { display:block; filter:drop-shadow(0 3px 4px rgba(12,42,58,.35)); }
  .pin.hl svg { filter:drop-shadow(0 0 0 3px var(--amber)) drop-shadow(0 3px 5px rgba(12,42,58,.4)); }
  .pin.hl { animation:bob 1.1s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }

  .legend { position:absolute; top:12px; left:12px; z-index:900; background:rgba(255,255,255,.94);
    backdrop-filter:blur(6px); border:1px solid var(--border); border-radius:10px; padding:9px 11px;
    font-size:11.5px; box-shadow:var(--shadow); display:grid; gap:5px; }
  .legend .row { display:flex; align-items:center; gap:7px; font-weight:500; }
  .legend .sw { width:11px; height:11px; border-radius:50%; border:1.5px solid #fff; box-shadow:0 0 0 1px var(--border); }

  .actionbar { position:relative; z-index:1100; display:flex; gap:10px;
    padding:12px 12px calc(env(safe-area-inset-bottom) + 12px);
    background:linear-gradient(to top, var(--surface) 78%, rgba(255,255,255,0)); }
  .btn { border:none; border-radius:13px; font-family:var(--sans); font-weight:600; font-size:15px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-primary { flex:1; background:var(--brand); color:#fff; padding:15px; box-shadow:0 6px 16px rgba(14,116,144,.35); }
  .btn-primary:active { background:var(--brand-d); }
  .btn-second { flex:1; background:var(--surface); color:var(--brand); padding:15px; border:1.5px solid var(--brand); }
  .btn-second:active { background:#ECFEFF; }

  .scrim { position:fixed; inset:0; background:rgba(12,42,58,.45); z-index:1500; opacity:0; pointer-events:none; transition:opacity .22s ease; }
  .scrim.open { opacity:1; pointer-events:auto; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:1600; background:var(--surface);
    border-radius:20px 20px 0 0; padding:8px 20px calc(env(safe-area-inset-bottom) + 22px);
    box-shadow:0 -10px 40px rgba(12,42,58,.28); transform:translateY(101%);
    transition:transform .28s cubic-bezier(.32,.72,0,1); max-height:86vh; overflow-y:auto; }
  .sheet.open { transform:translateY(0); }
  .grip { width:40px; height:4px; border-radius:999px; background:var(--border); margin:0 auto 16px; }
  .sheet h2 { font-size:20px; letter-spacing:-.3px; margin-bottom:3px; }
  .sheet .meta { font-family:var(--mono); font-size:12px; color:var(--muted); margin-bottom:14px; }

  .badge { display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px; font-size:12px; font-weight:600; }
  .badge.abierta,.badge.ok { background:#CFFAFE; color:var(--brand-d); }
  .badge.cerrada,.badge.alta { background:#FEE2E2; color:var(--danger); }
  .badge.baja { background:#FEF3C7; color:#B45309; }
  .badge .dotb { width:7px; height:7px; border-radius:50%; background:currentColor; }
  .badge.srv { background:#E0F2FE; color:#0369A1; }

  .datagrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0 8px; }
  .cell { background:var(--bg); border-radius:12px; padding:11px 13px; }
  .cell.big { grid-column:1 / -1; }
  .cell .k { font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.4px; }
  .cell .v { font-family:var(--mono); font-size:15px; font-weight:600; margin-top:3px; }
  .cell .v.xl { font-size:26px; }
  .note { font-size:12px; color:var(--muted); line-height:1.5; margin-top:14px; padding-top:12px; border-top:1px solid var(--border); }
  .reco { background:var(--bg); border-left:3px solid var(--brand); border-radius:0 10px 10px 0; padding:11px 13px; margin-top:14px; font-size:13.5px; line-height:1.5; }
  .reco.alta { border-color:var(--danger); } .reco.baja { border-color:var(--amber); } .reco.ok { border-color:var(--ok); }

  .field { margin-bottom:13px; }
  .field label { display:block; font-size:13px; font-weight:600; color:#334155; margin-bottom:6px; }
  .field .hint { font-weight:400; color:var(--muted); font-size:12px; }
  .field input,.field select { width:100%; padding:13px 12px; border:1.5px solid var(--border); border-radius:11px;
    font-size:16px; font-family:var(--sans); color:var(--text); background:var(--surface); }
  .field input:focus,.field select:focus { outline:none; border-color:var(--brand); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .sheet-actions { display:flex; gap:10px; margin-top:6px; }
  .sheet-actions .btn { flex:1; padding:14px; }
  .btn-line { background:var(--surface); border:1.5px solid var(--border); color:var(--text); }
  .btn-danger { background:var(--surface); border:1.5px solid #FCA5A5; color:var(--danger); }

  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 92px); transform:translate(-50%,20px);
    z-index:2000; background:var(--deep); color:#fff; padding:12px 18px; border-radius:12px; font-size:13.5px;
    font-weight:500; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:all .28s ease; max-width:90vw; text-align:center; }
  .toast.show { opacity:1; transform:translate(-50%,0); }
  input[type=file] { display:none; }
</style>
</head>
<body>

<header class="appbar">
  <svg class="brandmark" viewBox="0 0 40 40" fill="none">
    <path d="M20 4C20 4 8 17 8 26a12 12 0 0 0 24 0C32 17 20 4 20 4Z" fill="#06B6D4"/>
    <path d="M15 25a5 5 0 0 0 5 5" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
  </svg>
  <div class="brandtext"><div class="name">HydriaDeza</div><div class="sub">RED DE AGUA · DEZA</div></div>
  <div class="gps" id="gps"><span class="led"></span><span id="gpsTxt">Buscando GPS</span></div>
  <button class="iconbtn" onclick="abrirAjustes()" aria-label="Ajustes">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.17V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 8 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15H4.5a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 6 9.4l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 11 4.6h.09A2 2 0 0 1 15 4.6a1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0 .34 1.82v.09a2 2 0 0 1 0 4Z"/></svg>
  </button>
</header>

<div class="searchwrap">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search" placeholder="Buscar avería o aldea…">
  </div>
</div>

<div id="map">
  <div class="legend">
    <div class="row"><span class="sw" style="background:var(--brand)"></span>Abierta</div>
    <div class="row"><span class="sw" style="background:var(--danger)"></span>Cerrada</div>
    <div class="row"><span class="sw" style="background:var(--ok)"></span>Tu posición</div>
  </div>
</div>

<div class="actionbar">
  <button class="btn btn-primary" onclick="registrarAqui()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.3-7-11a7 7 0 0 1 14 0c0 4.7-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
    Registrar válvula
  </button>
  <button class="btn btn-second" onclick="presionAqui()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-3-3-7-7-11C8 8 5 12 5 15a7 7 0 0 0 7 7Z"/><path d="M12 15v-3"/></svg>
    Presión aquí
  </button>
  <input type="file" id="file" accept="application/json" onchange="importar(event)">
</div>

<div class="scrim" id="scrim" onclick="cerrarSheet()"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.min.js"></script>
<script>
const CENTRO = [42.6614, -8.1132];
const KEY = 'hydriadeza_valvulas', CFG = 'hydriadeza_cfg';
const SEED = [{ id:1, nombre:'Vilanova', lat:42.615239, lng:-8.135261, diametro:100, estado:'cerrada', aisla:'Vilanova' }];
const CFG_DEF = { cota_deposito:500, pmin:25, pmax:50, consigna:35, apiUrl:'' };
const BAR = 10.2;

let valvulas = cargar();
let map, posOperario = null, userMarker = null, routingControl = null, capturada = null;
const markers = {};

// --- Seguridad: nunca insertar texto de usuario/servidor en innerHTML sin escapar ---
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function numOr(v, def = 0) { const n = Number(v); return Number.isFinite(n) ? n : def; }

// Normaliza cualquier objeto "válvula" (venga de un formulario, de un import de
// fichero o del backend) a una forma segura y con tipos correctos.
function sanitizeValvula(v) {
  return {
    id: v.id ?? Date.now(),
    nombre: String(v.nombre ?? 'Sin nombre').slice(0, 120) || 'Sin nombre',
    lat: numOr(v.lat), lng: numOr(v.lng),
    estado: v.estado === 'cerrada' ? 'cerrada' : 'abierta',
    aisla: String(v.aisla ?? '').slice(0, 120),
    diametro: v.diametro != null && Number.isFinite(Number(v.diametro)) ? Number(v.diametro) : null,
    srvId: v.srvId ?? null,
  };
}

function cargar() { try { const r=localStorage.getItem(KEY); return (r?JSON.parse(r):SEED.slice()).map(sanitizeValvula); } catch { return SEED.slice().map(sanitizeValvula); } }
function persistir() { try { localStorage.setItem(KEY, JSON.stringify(valvulas)); } catch (e) { console.warn('[LS] no se pudo guardar', e); } }
function getCfg() { try { return Object.assign({}, CFG_DEF, JSON.parse(localStorage.getItem(CFG)||'{}')); } catch { return {...CFG_DEF}; } }
function setCfg(c) { try { localStorage.setItem(CFG, JSON.stringify(c)); } catch {} }
const bar = mca => (mca/BAR).toFixed(1);

function toast(m) { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2800); }

function initMap() {
  map = L.map('map', { zoomControl:false }).setView(CENTRO, 14);
  L.control.zoom({ position:'bottomleft' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution:'© OpenStreetMap © CARTO', maxZoom:20, subdomains:'abcd' }).addTo(map);
  valvulas.forEach(v => pintar(v)); ajustarVista();
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(onPos, ()=>setGps(false), { enableHighAccuracy:true });
    navigator.geolocation.watchPosition(onPos, null, { enableHighAccuracy:true });
  }
  sincronizar({ silencioso:true });
}
function onPos(p) {
  posOperario = L.latLng(p.coords.latitude, p.coords.longitude); setGps(true);
  if (userMarker) userMarker.setLatLng(posOperario);
  else { userMarker = L.circleMarker(posOperario,{radius:9,color:'#fff',weight:3,fillColor:'#059669',fillOpacity:1}).addTo(map); map.setView(posOperario,16); }
}
function setGps(on) { const g=document.getElementById('gps'); g.classList.toggle('on',on); document.getElementById('gpsTxt').textContent = on?'GPS activo':'Sin GPS'; }

function pinIcon(estado, hl) {
  const c = estado==='cerrada' ? '#DC2626' : '#0E7490';
  return L.divIcon({ className:'', html:`<div class="pin ${hl?'hl':''}"><svg width="30" height="40" viewBox="0 0 30 40">
    <path d="M15 39c0-1 12-14 12-24A12 12 0 1 0 3 15c0 10 12 23 12 24Z" fill="${c}"/>
    <circle cx="15" cy="15" r="6.5" fill="#fff"/><circle cx="15" cy="15" r="3" fill="${c}"/></svg></div>`,
    iconSize:[30,40], iconAnchor:[15,39] });
}
function pintar(v, hl=false) {
  if (markers[v.id]) markers[v.id].remove();
  const m = L.marker([v.lat,v.lng], { icon:pinIcon(v.estado,hl) }).addTo(map);
  m.on('click', ()=>abrirDetalle(v)); markers[v.id]=m;
}
function ajustarVista() { const ms=Object.values(markers); if (ms.length) map.fitBounds(L.featureGroup(ms).getBounds().pad(0.35)); }

function abrirSheet() { document.getElementById('scrim').classList.add('open'); document.getElementById('sheet').classList.add('open'); }
function cerrarSheet() { document.getElementById('scrim').classList.remove('open'); document.getElementById('sheet').classList.remove('open'); }

function abrirDetalle(v) {
  document.getElementById('sheetBody').innerHTML = `
    <h2>${esc(v.nombre)}</h2>
    <div class="meta">${v.lat.toFixed(6)}, ${v.lng.toFixed(6)}</div>
    <span class="badge ${v.estado === 'cerrada' ? 'cerrada' : 'abierta'}"><span class="dotb"></span>${v.estado==='cerrada'?'Cerrada':'Abierta'}</span>
    ${v.srvId ? '<span class="badge srv">Sincronizada</span>' : ''}
    <div class="datagrid">
      <div class="cell"><div class="k">Diámetro</div><div class="v">${v.diametro?'DN '+esc(v.diametro):'—'}</div></div>
      <div class="cell"><div class="k">Aísla</div><div class="v" style="font-family:var(--sans)">${esc(v.aisla)||'—'}</div></div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-danger" onclick="borrar(${Number(v.id)||0})">Borrar</button>
      <button class="btn btn-primary" onclick="trazarRuta(${Number(v.lat)},${Number(v.lng)})">Trazar ruta</button>
    </div>`;
  abrirSheet();
}

function registrarAqui() {
  if (!navigator.geolocation) { toast('Este dispositivo no tiene GPS'); return; }
  toast('Leyendo tu ubicación…');
  navigator.geolocation.getCurrentPosition((p)=>{
    capturada = { lat:p.coords.latitude, lng:p.coords.longitude, prec:p.coords.accuracy };
    document.getElementById('sheetBody').innerHTML = `
      <h2>Nueva válvula</h2>
      <div class="meta">${capturada.lat.toFixed(6)}, ${capturada.lng.toFixed(6)} · ±${Math.round(capturada.prec)} m</div>
      <div style="height:12px"></div>
      <div class="field"><label>Aldea o calle</label><input id="f_nombre" placeholder="Ej: Vilanova" autocomplete="off" maxlength="120"></div>
      <div class="field"><label>Estado</label><select id="f_estado"><option value="abierta">Abierta</option><option value="cerrada">Cerrada</option></select></div>
      <div class="field"><label>¿Qué aísla?</label><input id="f_aisla" placeholder="Zona que se queda sin agua" autocomplete="off" maxlength="120"></div>
      <div class="field"><label>Diámetro DN (opcional)</label><input id="f_dn" type="number" inputmode="numeric" placeholder="Ej: 100" min="1"></div>
      <div class="sheet-actions">
        <button class="btn btn-line" onclick="cerrarSheet()">Cancelar</button>
        <button class="btn btn-primary" onclick="guardar()">Guardar válvula</button>
      </div>`;
    abrirSheet();
  }, ()=>toast('No pude leer el GPS. Activa la ubicación.'), { enableHighAccuracy:true });
}
async function guardar() {
  const nombre = (document.getElementById('f_nombre').value||'').trim()||'Sin nombre';
  const nueva = sanitizeValvula({ id:Date.now(), nombre, lat:capturada.lat, lng:capturada.lng,
    estado:document.getElementById('f_estado').value, aisla:(document.getElementById('f_aisla').value||'').trim(),
    diametro:document.getElementById('f_dn').value?Number(document.getElementById('f_dn').value):null });
  valvulas.push(nueva); persistir(); pintar(nueva); map.setView([nueva.lat,nueva.lng],17); cerrarSheet(); toast(`Válvula "${nombre}" registrada`);

  const apiUrl = getCfg().apiUrl;
  if (apiUrl) {
    try {
      const r = await fetch(`${apiUrl}/api/valvulas`, {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ nombre:nueva.nombre, lat:nueva.lat, lng:nueva.lng, estado:nueva.estado, aisla:nueva.aisla||null, diametro:nueva.diametro }),
      });
      if (r.ok) {
        const data = await r.json();
        nueva.srvId = data.id; persistir();
        toast(`Válvula "${nombre}" sincronizada con el servidor`);
      } else { toast('Guardada localmente; el servidor rechazó la sincronización'); }
    } catch { toast('Guardada localmente; sin conexión con el servidor'); }
  }
}
async function borrar(id) {
  const v = valvulas.find(x=>x.id===id);
  if (!confirm(`¿Borrar la válvula "${v?v.nombre:''}"?`)) return;
  valvulas = valvulas.filter(x=>x.id!==id); persistir();
  if (markers[id]) { markers[id].remove(); delete markers[id]; } cerrarSheet(); toast('Válvula borrada');

  const apiUrl = getCfg().apiUrl;
  if (apiUrl && v && v.srvId) {
    try { await fetch(`${apiUrl}/api/valvulas/${encodeURIComponent(v.srvId)}`, { method:'DELETE' }); }
    catch { /* la borramos igualmente en local; se reconciliará al sincronizar */ }
  }
}

function trazarRuta(lat,lng) {
  cerrarSheet();
  if (!posOperario) { toast('Aún no tengo tu ubicación GPS'); return; }
  if (routingControl) map.removeControl(routingControl);
  routingControl = L.Routing.control({ waypoints:[posOperario, L.latLng(lat,lng)],
    router:L.Routing.osrmv1({ serviceUrl:'https://router.project-osrm.org/route/v1' }),
    lineOptions:{ styles:[{ color:'#0E7490', weight:5, opacity:.9 }] },
    createMarker:()=>null, addWaypoints:false, fitSelectedRoutes:true, show:false }).addTo(map);
  toast('Ruta trazada');
}

/* ---------- SINCRONIZACIÓN CON EL BACKEND ---------- */
async function sincronizar({ silencioso=false } = {}) {
  const apiUrl = getCfg().apiUrl;
  if (!apiUrl) { if (!silencioso) toast('Configura la URL del servidor en Ajustes'); return; }
  try {
    const r = await fetch(`${apiUrl}/api/valvulas`);
    if (!r.ok) throw new Error('respuesta no válida');
    const geojson = await r.json();
    const yaSincronizadas = new Set(valvulas.filter(v=>v.srvId).map(v=>v.srvId));
    let nuevas = 0;
    for (const f of (geojson.features||[])) {
      const p = f.properties || {};
      if (yaSincronizadas.has(p.id)) continue;
      const [lng, lat] = f.geometry.coordinates;
      valvulas.push(sanitizeValvula({ id:`srv-${p.id}`, nombre:p.nombre, lat, lng, estado:p.estado, aisla:p.aisla, diametro:p.diametro, srvId:p.id }));
      nuevas++;
    }
    if (nuevas) { persistir(); valvulas.forEach(v=>pintar(v)); ajustarVista(); }
    if (!silencioso) toast(nuevas ? `${nuevas} válvulas nuevas del servidor` : 'Ya estaba todo sincronizado');
  } catch {
    if (!silencioso) toast('No se pudo contactar con el servidor');
  }
}

/* ---------- PRESIÓN ---------- */
async function cotaDe(lat, lng) {
  const r = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lng}`);
  const j = await r.json();
  return Array.isArray(j.elevation) ? j.elevation[0] : null;
}
async function tuberiaCercana(lat, lng) {
  const apiUrl = getCfg().apiUrl;
  if (!apiUrl) return null;
  try {
    const r = await fetch(`${apiUrl}/api/tuberias/cercana?lat=${lat}&lng=${lng}`);
    return r.ok ? await r.json() : null;
  } catch { return null; }
}
function presionAqui() {
  if (!navigator.geolocation) { toast('Este dispositivo no tiene GPS'); return; }
  toast('Leyendo tu ubicación…');
  navigator.geolocation.getCurrentPosition(async (p)=>{
    toast('Midiendo cota del terreno…');
    let cota;
    try { cota = await cotaDe(p.coords.latitude, p.coords.longitude); }
    catch { toast('Sin conexión para medir la cota'); return; }
    if (cota == null) { toast('No pude obtener la cota de este punto'); return; }
    const tuberia = await tuberiaCercana(p.coords.latitude, p.coords.longitude);
    mostrarPresion(cota, p.coords, tuberia);
  }, ()=>toast('Activa la ubicación'), { enableHighAccuracy:true });
}
const NOMBRE_MATERIAL = { pvc:'PVC', polietileno:'Polietileno', fibrocemento:'Fibrocemento' };
function mostrarPresion(cota, coords, tuberia) {
  const c = getCfg();
  const P = c.cota_deposito - cota;
  let estado, etiqueta, reco;
  if (P < c.pmin) {
    estado='baja'; etiqueta='Presión insuficiente';
    reco = `Faltan ≈ <b>${(c.pmin-P).toFixed(0)} mca</b> para el mínimo de servicio. Este punto requiere <b>bombeo o grupo de presión</b>.`;
  } else if (P > c.pmax) {
    estado='alta'; etiqueta='Sobrepresión';
    reco = `Supera el máximo en ≈ <b>${(P-c.pmax).toFixed(0)} mca</b>. Conviene una <b>VRP</b>. Consigna orientativa ≈ <b>${c.consigna} mca (${bar(c.consigna)} bar)</b>.`;
  } else {
    estado='ok'; etiqueta='Presión correcta';
    reco = `Dentro de la banda de servicio (${c.pmin}–${c.pmax} mca). No requiere reducción.`;
  }

  // CTE DB-HS4 (Código Técnico de la Edificación, salubridad, suministro de
  // agua): 100-500 kPa en el punto de consumo de una vivienda. Es un criterio
  // normativo fijo, independiente de la banda de servicio (pmin/pmax) que
  // configura el operario en Ajustes.
  const CTE_MIN_BAR = 1.0, CTE_MAX_BAR = 5.0;
  const Pbar = Number(bar(P));
  let cteHtml;
  if (Pbar < CTE_MIN_BAR) {
    cteHtml = `<div class="reco alta">🏠 <b>CTE DB-HS4 (vivienda): no cumple.</b> ${Pbar} bar está por debajo del mínimo normativo (${CTE_MIN_BAR} bar / 100 kPa) en el punto de consumo. Una vivienda aquí necesitaría grupo de presión.</div>`;
  } else if (Pbar > CTE_MAX_BAR) {
    cteHtml = `<div class="reco alta">🏠 <b>CTE DB-HS4 (vivienda): no cumple.</b> ${Pbar} bar supera el máximo normativo (${CTE_MAX_BAR} bar / 500 kPa). Una vivienda aquí necesitaría VRP antes de la acometida.</div>`;
  } else {
    cteHtml = `<div class="reco ok">🏠 <b>CTE DB-HS4 (vivienda): cumple.</b> ${Pbar} bar está dentro del rango normativo (${CTE_MIN_BAR}–${CTE_MAX_BAR} bar / 100–500 kPa) exigido en el punto de consumo.</div>`;
  }
  cteHtml += `<div class="note">La CTE exige esta presión <b>en el punto de consumo</b> (grifo), no en el suelo: la altura de la vivienda y las pérdidas de su instalación interior restan presión adicional no incluida aquí.</div>`;

  let materialHtml = '';
  if (tuberia) {
    const limite = tuberia.pn_limite_bar;
    const excede = Pbar > limite;
    const nombreMat = esc(NOMBRE_MATERIAL[tuberia.material] || 'material sin documentar');
    materialHtml = `
      <div class="reco ${excede?'alta':'ok'}">
        Tubería más cercana <b>${esc(tuberia.id)}</b> (a ${tuberia.distancia_m} m): <b>${nombreMat}</b>,
        límite <b>PN ${limite} bar</b>${tuberia.pn?'':' (valor por defecto de catálogo, sin PN real documentada)'}.
        ${excede
          ? `<br><b>⚠ La presión estática (${Pbar} bar) supera el límite de este material.</b> Riesgo de rotura: valorar una VRP antes de este tramo o confirmar la PN real instalada.`
          : `La presión estática (${Pbar} bar) está dentro del límite del material.`}
      </div>`;
  } else if (getCfg().apiUrl) {
    materialHtml = `<div class="note">No se encontró ninguna tubería con material documentado cerca de este punto. Usa <b>Materiales de tuberías</b> en Ajustes para asignarlo.</div>`;
  }

  document.getElementById('sheetBody').innerHTML = `
    <h2>Presión en este punto</h2>
    <div class="meta">${coords.latitude.toFixed(6)}, ${coords.longitude.toFixed(6)} · ±${Math.round(coords.accuracy)} m</div>
    <span class="badge ${estado}"><span class="dotb"></span>${etiqueta}</span>
    <div class="datagrid">
      <div class="cell big"><div class="k">Presión estática disponible</div><div class="v xl">${P.toFixed(0)} mca · ${bar(P)} bar</div></div>
      <div class="cell"><div class="k">Cota del terreno</div><div class="v">${cota.toFixed(0)} m</div></div>
      <div class="cell"><div class="k">Cota depósito</div><div class="v">${c.cota_deposito} m</div></div>
    </div>
    <div class="reco ${estado}">${reco}</div>
    ${cteHtml}
    ${materialHtml}
    <div class="note">Cálculo <b>estático</b> = cota depósito − cota terreno. No incluye pérdidas de carga ni caudal, y la cota viene de un modelo de elevación (~90 m). Para precisión usa tu MDT05 (LiDAR 5 m) vía el backend. La consigna final debe validarla el técnico responsable con el modelo de red.</div>
    <div style="height:8px"></div>
    <div class="sheet-actions"><button class="btn btn-line" onclick="abrirAjustes()">Ajustar depósito y banda</button></div>`;
  abrirSheet();
}

/* ---------- AJUSTES ---------- */
function abrirAjustes() {
  const c = getCfg();
  document.getElementById('sheetBody').innerHTML = `
    <h2>Ajustes de red</h2>
    <div class="meta">Base del cálculo de presión</div>
    <div style="height:6px"></div>
    <div class="field"><label>Cota del depósito <span class="hint">(m sobre el mar)</span></label><input id="c_dep" type="number" inputmode="decimal" value="${c.cota_deposito}"></div>
    <div class="two">
      <div class="field"><label>Presión mín. <span class="hint">mca</span></label><input id="c_pmin" type="number" inputmode="numeric" value="${c.pmin}"></div>
      <div class="field"><label>Presión máx. <span class="hint">mca</span></label><input id="c_pmax" type="number" inputmode="numeric" value="${c.pmax}"></div>
    </div>
    <div class="field"><label>Consigna objetivo VRP <span class="hint">mca</span></label><input id="c_cons" type="number" inputmode="numeric" value="${c.consigna}"></div>
    <div class="field"><label>URL del backend <span class="hint">(opcional, para sincronizar entre operarios)</span></label><input id="c_api" type="url" inputmode="url" placeholder="https://tu-servidor.example.com" value="${esc(c.apiUrl)}"></div>
    <div class="sheet-actions"><button class="btn btn-primary" onclick="guardarAjustes()">Guardar ajustes</button></div>
    <div class="note">Datos y respaldo</div>
    <div class="sheet-actions">
      <button class="btn btn-line" onclick="sincronizar()">Sincronizar ahora</button>
      <button class="btn btn-line" onclick="abrirMateriales()">Materiales de tuberías</button>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-line" onclick="exportar()">Exportar</button>
      <button class="btn btn-line" onclick="document.getElementById('file').click()">Importar</button>
    </div>`;
  abrirSheet();
}
async function abrirMateriales() {
  const apiUrl = getCfg().apiUrl;
  if (!apiUrl) { toast('Configura primero la URL del backend'); return; }
  document.getElementById('sheetBody').innerHTML = `<h2>Materiales de tuberías</h2><div class="meta">Cargando…</div>`;
  abrirSheet();
  let tuberias;
  try {
    const r = await fetch(`${apiUrl}/api/tuberias`);
    if (!r.ok) throw new Error('respuesta no válida');
    tuberias = await r.json();
  } catch {
    document.getElementById('sheetBody').innerHTML = `<h2>Materiales de tuberías</h2><div class="meta">No se pudo contactar con el servidor</div>`;
    return;
  }
  const opcion = (v, val) => `<option value="${val}" ${v===val?'selected':''}>${{'':'— sin documentar —',pvc:'PVC',polietileno:'Polietileno',fibrocemento:'Fibrocemento'}[val]}</option>`;
  const filas = tuberias.map(t => `
    <div class="field" data-tid="${esc(t.id)}">
      <label>${esc(t.id)} <span class="hint">(${esc(t.a)} → ${esc(t.b)}) · límite actual PN ${esc(t.pn_limite_bar)} bar</span></label>
      <div class="two">
        <select class="mat-material">${['',  'pvc','polietileno','fibrocemento'].map(v=>opcion(t.material||'',v)).join('')}</select>
        <input class="mat-pn" type="number" step="0.5" min="0" placeholder="PN real bar (opcional)" value="${t.pn ?? ''}">
      </div>
    </div>`).join('') || '<div class="meta">No hay tuberías cargadas en el servidor.</div>';
  document.getElementById('sheetBody').innerHTML = `
    <h2>Materiales de tuberías</h2>
    <div class="meta">Asigna el material real de cada tramo para calcular su límite de presión (PN)</div>
    <div style="height:8px"></div>
    ${filas}
    <div class="sheet-actions"><button class="btn btn-primary" onclick="guardarMateriales()">Guardar cambios</button></div>`;
}
async function guardarMateriales() {
  const apiUrl = getCfg().apiUrl;
  const filas = document.querySelectorAll('#sheetBody [data-tid]');
  let ok = 0, fail = 0;
  for (const fila of filas) {
    const id = fila.dataset.tid;
    const material = fila.querySelector('.mat-material').value;
    if (!material) continue;
    const pnVal = fila.querySelector('.mat-pn').value;
    try {
      const r = await fetch(`${apiUrl}/api/tuberias/${encodeURIComponent(id)}`, {
        method:'PATCH', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ material, pn: pnVal ? Number(pnVal) : null }),
      });
      if (r.ok) ok++; else fail++;
    } catch { fail++; }
  }
  toast(fail ? `${ok} tramos guardados, ${fail} con error` : (ok ? `${ok} tramos actualizados` : 'Ningún tramo tenía material seleccionado'));
  if (ok) cerrarSheet();
}
function guardarAjustes() {
  const c = { cota_deposito:Number(document.getElementById('c_dep').value)||CFG_DEF.cota_deposito,
    pmin:Number(document.getElementById('c_pmin').value)||CFG_DEF.pmin,
    pmax:Number(document.getElementById('c_pmax').value)||CFG_DEF.pmax,
    consigna:Number(document.getElementById('c_cons').value)||CFG_DEF.consigna,
    apiUrl:(document.getElementById('c_api').value||'').trim().replace(/\/+$/,'') };
  setCfg(c); cerrarSheet(); toast('Ajustes guardados');
}

document.getElementById('search').addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase(); let primera=null;
  valvulas.forEach(v=>{ const match = !!q && ((v.aisla||'').toLowerCase().includes(q)||(v.nombre||'').toLowerCase().includes(q));
    pintar(v, match); if (match && !primera) primera=v; });
  if (primera) map.setView([primera.lat,primera.lng],16);
});

function exportar() {
  const blob = new Blob([JSON.stringify(valvulas,null,2)], { type:'application/json' });
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='valvulas_hydriadeza.json'; a.click();
  toast(`${valvulas.length} válvulas exportadas`);
}
function importar(ev) {
  const file = ev.target.files[0]; if (!file) return; const r=new FileReader();
  r.onload = () => { try { const data=JSON.parse(r.result); if (!Array.isArray(data)) throw 0;
    valvulas=data.map(sanitizeValvula); persistir(); Object.values(markers).forEach(m=>m.remove()); for (const k in markers) delete markers[k];
    valvulas.forEach(v=>pintar(v)); ajustarVista(); cerrarSheet(); toast(`${valvulas.length} válvulas importadas`);
  } catch { toast('Archivo JSON no válido'); } };
  r.readAsText(file);
  ev.target.value = '';
}

initMap();
</script>
</body>
</html>
